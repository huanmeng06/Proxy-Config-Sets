[Host]
localhost = 127.0.0.1
# YepFast node ingress. Measured 2026-10-01 via Clash proxy-server-nameserver
# tcp://UUID.o-0-u-c.beyond1836.com:8081 → 121.41.16.76:8081
#   *.cloud.we-tencent.click
#     CNAME v0529.app.wechat2.cc
#     CNAME 3x-fjct-v0530.wechat1.cc
#     A     222.79.111.253  (AS133774 China Telecom Fuzhou)
# Public resolvers send the SAME hostname elsewhere:
#   1.1.1.1  → overseas.wechat2.cc → 23.94.112.2 Colocrossing LA
#   223.5.5.5 → yp-ct.wechat1.cc → 218.236.223.212 / 123.253.227.18
# That is why Netin/Clash land on Komi 140.235.143.164 while stock
# Shadowrocket landed on Seattle GTHost 216.106.186.234.
# Pin is local hosts for the NODE hostname (not Claude dest DNS).
# Keep use-local-host-item-for-proxy = false so Claude still remote-DNS.
# If you leave Fujian/campus and nodes fail to connect, delete these
# three lines and rely on proxy-dns-server, then reconnect.
*.cloud.we-tencent.click = 222.79.111.253
v0529.app.wechat2.cc = 222.79.111.253
3x-fjct-v0530.wechat1.cc = 222.79.111.253

[URL Rewrite]
^https?://(www.)?g.cn($|/.*) https://www.google.com$2 302
^https?://(www.)?google.cn($|/.*) https://www.google.com$2 302

[MITM]
# Certificate and passphrase stay on the phone. Do NOT add claude.ai / anthropic.com / itunes / appleid.
hostname = googleads.g.doubleclick-cn.net, *.applovin.com, adexp.chinaliftoff.io, -redirector*.googlevideo.com, *.googlevideo.com, www.youtube.com, s.youtube.com, youtubei.googleapis.com
enable = true
