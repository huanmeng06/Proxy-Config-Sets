🔗 链式节点 = url-test,url=http://www.gstatic.com/generate_204,interval=300,tolerance=50,timeout=8,DIRECT,policy-regex-filter=(?i)^(?!.*ISP)(?!.*(Data Left|Remain:|Traffic:|Expir|Reset|剩[余餘]流量|流量：|[到过過效]期|[时時][间間]|重置|分割线|官[网方]|获取|地址|群|更新|🔰|ISP)).+
