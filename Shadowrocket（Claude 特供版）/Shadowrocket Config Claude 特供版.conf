[Rule]
# Order matches Clash Script.js:
# LAN → captive → Claude UDP REJECT → ChatGPT → Claude/Stripe/Persona → rejects → overrides → RULE-SET → GEOIP → FINAL
# UDP AND rules MUST sit above DOMAIN rules, otherwise Claude UDP would enter 🧠 Claude instead of REJECT.

# --- 0. LAN (Clash IP-CIDR DIRECT, no-resolve) ---
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
DEST-PORT,123,DIRECT
DEST-PORT,5223,DIRECT

# --- 1. Captive / campus (DIRECT + system DNS). Do this before any proxy keyword. ---
DOMAIN,captive.apple.com,DIRECT
DOMAIN,captive.apple.com.cn,DIRECT
DOMAIN,netctscan.apple.com,DIRECT
DOMAIN,detectportal.firefox.com,DIRECT
DOMAIN,connectivitycheck.gstatic.com,DIRECT
DOMAIN,www.msftconnecttest.com,DIRECT
DOMAIN,ipv6.msftconnecttest.com,DIRECT
