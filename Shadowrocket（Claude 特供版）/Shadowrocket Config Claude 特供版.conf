# Shadowrocket Claude chained configuration (public / no credentials)
# Source: Clash（Claude 特供版）/Clash Verge Rev 链式代理.js
# Add private airport and ISP nodes on-device. ISP names contain ISP; bind ISP Proxy Through to 📡 链式入口.
# Chain direction: airport entry → ISP landing → destination.
# Shadowrocket cannot express Clash nameserver-policy, PROCESS-PATH-REGEX, or dialer-proxy exactly.
# This file uses encrypted DoH for node bootstrap, while Shadowrocket resolves proxy traffic remotely
# and uses system/DHCP DNS for DIRECT/captive lookups;
# process-name rules, filtered chain groups, and remote rule sets as the closest native mapping.

[General]
bypass-system = true
skip-proxy = 192.168.0.0/16,10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,localhost,*.local,captive.apple.com,netctscan.apple.com,detectportal.firefox.com,connectivitycheck.gstatic.com,neverssl.com,www.msftconnecttest.com,dns.msftncsi.com,*.arubanetworks.com,*.arubanetworks.cc,*.bnbu.edu.cn,*.uic.edu.cn,*.msftconnecttest.com
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.168.0.0/16,224.0.0.0/4
dns-server = 223.5.5.5,223.6.6.6,119.29.29.29,system
fallback-dns-server = system
proxy-dns-server = https://1.1.1.1/dns-query,https://8.8.8.8/dns-query
dns-direct-system = true
dns-direct-fallback-proxy = false
dns-fallback-system = true
ipv6 = false
prefer-ipv6 = false
allow-dns-svcb = false
close-if-proxy-chain-missing = true
udp-policy-not-supported-behaviour = REJECT
hijack-dns = 8.8.8.8,8.8.4.4,1.1.1.1,1.0.0.1
icmp-auto-reply = true
private-ip-answer = true
use-local-host-item-for-proxy = false

[Proxy]
# Public file intentionally contains no nodes or credentials.

